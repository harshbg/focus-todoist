<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Focus for Todoist" shape-rendering="crispEdges">
  <!-- Sky background square -->
  <rect width="32" height="32" fill="#a9c9e3"/>

  <!-- Pyramid of bevelled bricks (3 rows) -->
  <!-- Row 1 (top): 1 brick at x=12, y=7 -->
  <rect x="12" y="7" width="8" height="5" fill="#17110b"/>
  <rect x="13" y="8" width="6" height="3" fill="#f6bd55"/>
  <rect x="13" y="8" width="6" height="1" fill="#fde7a8"/>
  <rect x="13" y="8" width="1" height="3" fill="#fde7a8"/>
  <rect x="18" y="9" width="1" height="2" fill="#d9772c"/>
  <rect x="14" y="10" width="5" height="1" fill="#b8521f"/>

  <!-- Row 2: 2 bricks at y=12 -->
  <rect x="8" y="12" width="8" height="5" fill="#17110b"/>
  <rect x="9" y="13" width="6" height="3" fill="#ef9632"/>
  <rect x="9" y="13" width="6" height="1" fill="#f9c66a"/>
  <rect x="9" y="13" width="1" height="3" fill="#f9c66a"/>
  <rect x="14" y="14" width="1" height="2" fill="#cf5a22"/>
  <rect x="10" y="15" width="5" height="1" fill="#a9401a"/>

  <rect x="16" y="12" width="8" height="5" fill="#17110b"/>
  <rect x="17" y="13" width="6" height="3" fill="#e3762d"/>
  <rect x="17" y="13" width="6" height="1" fill="#f4a54f"/>
  <rect x="17" y="13" width="1" height="3" fill="#f4a54f"/>
  <rect x="22" y="14" width="1" height="2" fill="#c04a1d"/>
  <rect x="18" y="15" width="5" height="1" fill="#9a3416"/>

  <!-- Row 3 (bottom): 3 bricks at y=17 -->
  <rect x="4" y="17" width="8" height="5" fill="#17110b"/>
  <rect x="5" y="18" width="6" height="3" fill="#e3762d"/>
  <rect x="5" y="18" width="6" height="1" fill="#f4a54f"/>
  <rect x="5" y="18" width="1" height="3" fill="#f4a54f"/>
  <rect x="10" y="19" width="1" height="2" fill="#c04a1d"/>
  <rect x="6" y="20" width="5" height="1" fill="#9a3416"/>

  <rect x="12" y="17" width="8" height="5" fill="#17110b"/>
  <rect x="13" y="18" width="6" height="3" fill="#f6bd55"/>
  <rect x="13" y="18" width="6" height="1" fill="#fde7a8"/>
  <rect x="13" y="18" width="1" height="3" fill="#fde7a8"/>
  <rect x="18" y="19" width="1" height="2" fill="#d9772c"/>
  <rect x="14" y="20" width="5" height="1" fill="#b8521f"/>

  <rect x="20" y="17" width="8" height="5" fill="#17110b"/>
  <rect x="21" y="18" width="6" height="3" fill="#ef9632"/>
  <rect x="21" y="18" width="6" height="1" fill="#f9c66a"/>
  <rect x="21" y="18" width="1" height="3" fill="#f9c66a"/>
  <rect x="26" y="19" width="1" height="2" fill="#cf5a22"/>
  <rect x="22" y="20" width="5" height="1" fill="#a9401a"/>

  <!-- Ground strip (width 28, height 4, centered from x=2 to 30, y=22 to 26) -->
  <rect x="2" y="22" width="28" height="4" fill="#1b130c"/>
  <rect x="3" y="23" width="26" height="2" fill="#c9773a"/>
  <rect x="6" y="23" width="4" height="2" fill="#9c5426"/>
  <rect x="14" y="23" width="4" height="2" fill="#9c5426"/>
  <rect x="22" y="23" width="4" height="2" fill="#9c5426"/>
  <rect x="3" y="22" width="26" height="1" fill="#7a3b1a"/>
</svg>
